<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vermera</title>
  <meta name="description" content="Vermera — a curated edit of bags, dresses, jewelry, shoes, watches, and beauty essentials, each piece selected for its quality and quiet character.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!--
    This is a client-rendered SPA — the homepage's hero <img> (the LCP
    element) doesn't exist in this HTML at all; it's written in by React
    after the JS bundle loads and runs. Without this, the browser's preload
    scanner has nothing to find until then (Lighthouse: LCP request
    discovery, "Request is discoverable in initial document" = false).
    Preloading it here lets the browser start fetching it immediately
    instead of waiting on JS.

    The two preloads mirror Hero.jsx's <picture> exactly (same files, same
    media queries, so the browser fetches only the one it will use) — keep
    them in sync. They're added from this tiny inline script rather than
    as plain <link> tags because this file is served for every route
    (vercel.json rewrites deep links here): only the homepage shows the
    hero, and the landscape file is ~280 KB, too much to waste on a direct
    visit to /products or a product page. A synchronous script in <head>
    runs during parsing, so the fetch starts essentially as early.
  -->
  <script>
    if (location.pathname === "/") {
      [
        ["/images/hero-image-portrait.webp", "(max-aspect-ratio: 3/4)"],
        ["/images/hero-image.webp", "not all and (max-aspect-ratio: 3/4)"],
      ].forEach(function (entry) {
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.href = entry[0];
        link.media = entry[1];
        link.setAttribute("fetchpriority", "high");
        document.head.appendChild(link);
      });
    }
  </script>
  <!--
    Loaded non-render-blocking: fetch it at high priority via preload, then
    swap it in as the real stylesheet once it arrives (the "print" media
    trick — it doesn't block rendering because the browser doesn't need
    print styles for an on-screen render) instead of the plain <link
    rel="stylesheet"> this used to be, which held first paint hostage to
    fonts.googleapis.com. The <noscript> keeps it working with JS disabled.
    &display=swap in the URL already means text renders in the fallback
    font immediately either way, so this only removes the block — it
    doesn't change which font swap happens or when.
  -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap"
  >
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap"
    media="print"
    onload="this.media='all'"
  >
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap">
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
